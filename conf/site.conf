SCONF_VERSION = "1"

BSPDIR := "${@os.path.abspath(os.path.dirname(d.getVar('FILE', True)) + '/../..')}"

DL_DIR = "${BSPDIR}/downloads/"

# Co-locate the hash equivalence database with SSTATE_DIR so multiple builds
# sharing the same sstate cache also share the hashserv database. Matches the
# recommendation in OE-Core's sanity.bbclass when SSTATE_DIR is shared across
# builds, and the default that bitbake-setup writes into local.conf.
BB_HASHSERVE_DB_DIR ?= "${SSTATE_DIR}"
